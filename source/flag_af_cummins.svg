<text x="768" y="900" text-anchor="middle" font-family="Impact, 'DejaVu Sans Condensed', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="92" letter-spacing="8" fill="#e9b23a">DON'T TREAD ON ME</text>
