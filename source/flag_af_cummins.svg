  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc3d8"/><stop offset="1" stop-color="#2d4658"/></linearGradient>
  <clipPath id="body"><path id="bp" d="M240 600 L240 525 Q242 485 285 478 L560 460 L640 335 Q645 328 660 328 L850 328 Q878 328 880 350 L880 462 L1320 462 L1326 640 L1202 640 A115 115 0 0 0 978 640 L542 640 A115 115 0 0 0 318 640 L240 640 Z"/></clipPath>
